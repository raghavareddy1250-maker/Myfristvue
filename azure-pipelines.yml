# Node.js with Vue
# Build a Node.js project that uses Vue.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  VITE_API_BASE_URL: 'https://myvueproject-fahzgmaxf7h9cmfp.westus3-01.azurewebsites.net/api'


steps:
- task: UseNode@1
  inputs:
    version: '20.x'
  displayName: 'Install Node.js'

- task: Npm@1
  inputs:
    command: 'install'
    workingDir: 'Client'
  displayName: 'Install vue.js'


- task: Npm@1
  inputs:
    command: 'custom'
    workingDir: 'Client'
    customCommand: 'run build'
  displayName: 'Build Node.js'


- task: CopyFiles@2
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)/Client/dist'
    Contents: '**'
    TargetFolder: '$(System.DefaultWorkingDirectory)/Server'
  displayName: 'Copy vue build files in Server folder'


- task: Npm@1
  inputs:
    command: 'install'
    workingDir: 'Server'
  displayName: 'Installing Node modules in Server'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/Server'
    includeRootFolder: true
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/MyVueProject.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/MyVueProject.zip'
    ArtifactName: 'release'
    publishLocation: 'Container'
